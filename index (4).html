function modal(html,bind){const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="dlg" role="dialog" aria-modal="true">'+html+'</div>';document.body.appendChild(o);const close=()=>o.remove();o.addEventListener('click',e=>{if(e.target===o)close()});if(bind)bind($('.dlg',o),close);return close}
function ask(h,txt,ok,fn,danger){modal(`<h3>${h}</h3><p>${txt}</p><div class="row"><button class="btn ghost" data-x>Back</button><button class="btn ${danger?'red':''}" data-ok>${ok}</button></div>`,(d,c)=>{$('[data-x]',d).onclick=c;$('[data-ok]',d).onclick=()=>{c();fn()}})}
let AC;const mkAC=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}};addEventListener('pointerdown',mkAC);
function beep(){try{mkAC();[0,.2].forEach((d,i)=>{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+d;o.frequency.value=i?1100:880;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.start(t);o.stop(t+.17)})}catch(e){}}
function parseItems(t){return t.split('\n').map(s=>s.trim()).filter(Boolean).map(l=>{const m=l.match(/^(\d+(?:\.\d+)?)\s*[x×*]\s*(.+?)\s*@\s*(\d+(?:\.\d+)?)$/i);if(!m)throw new Error('Cannot read line: '+l);return{q:+m[1],n:m[2],p:+m[3]}})}
const itemsTxt=it=>it.map(i=>`${i.q} x ${i.n} @ ${i.p}`).join('\n');
function parseMenu(t){const m=[];let c=null;for(const l of t.split('\n').map(s=>s.trim()).filter(Boolean)){if(l[0]==='#'){c={c:l.replace(/^#+\s*/,'')||'Menu',items:[]};m.push(c);continue}const x=l.match(/^(.+?)\s*@\s*(\d+(?:\.\d+)?)$/);if(!x)throw new Error('Use “Name @ price”: '+l);if(!c){c={c:'Menu',items:[]};m.push(c)}c.items.push({n:x[1],p:+x[2]})}return m}
const menuTxt=m=>(m||[]).map(c=>'# '+c.c+'\n'+c.items.map(i=>i.n+' @ '+i.p).join('\n')).join('\n\n');

/* ===== DATA LAYER (Supabase or localStorage demo) ===== */
const dk=()=>LS.g('demo:kv',{});
const api={
 async kvGet(k){if(DEMO){const o=dk()[k];return o?o.v:null}const{data,error}=await sb.from('kv').select('v').eq('k',k).maybeSingle();if(error)throw error;return data?data.v:null},
 async kvPut(k,venue,v){if(DEMO){const o=dk();if(!k.startsWith('venue:')){const vd=o['venue:'+venue];if(!vd||vd.v.active===false)throw new Error('Ordering is paused')}o[k]={venue,v};LS.s('demo:kv',o);return}const{error}=await sb.from('kv').upsert({k,venue,v});if(error)throw error},
 async kvVenue(venue){const r={};if(DEMO){const o=dk();for(const k in o)if(o[k].venue===venue)r[k]=o[k].v;return r}const{data,error}=await sb.from('kv').select('k,v').eq('venue',venue);if(error)throw error;data.forEach(x=>r[x.k]=x.v);return r},
 async ownerVenue(c){c=c.toLowerCase();if(DEMO)return LS.g('demo:pins',{})[c]||null;const{data,error}=await sb.rpc('owner_venue',{p_code:c});if(error)throw error;return data||null},
 async accList(cx,a,b){if(DEMO)return LS.g('demo:acc',[]).filter(e=>e.venue===cx.vid&&e.ts>=a&&e.ts<b).sort((x,y)=>x.ts<y.ts?-1:1);
  if(cx.master){const{data,error}=await sb.from('acc').select('*').eq('venue',cx.vid).gte('ts',a).lt('ts',b).order('ts');if(error)throw error;return data}
  const{data,error}=await sb.rpc('acc_list',{p_code:cx.code,p_from:a,p_to:b});if(error)throw error;return data},
 async accPut(cx,e){if(DEMO){const l=LS.g('demo:acc',[]).filter(x=>x.id!==e.id);l.push({...e,venue:cx.vid});LS.s('demo:acc',l);return}
  if(cx.master){const{error}=await sb.from('acc').upsert({...e,venue:cx.vid});if(error)throw error;return}
  const{error}=await sb.rpc('acc_put',{p_code:cx.code,p_id:e.id,p_ts:e.ts,p_tbl:e.tbl,p_items:e.items,p_method:e.method,p_amount:e.amount});if(error)throw error},
 async accDel(cx,id){if(DEMO){LS.s('demo:acc',LS.g('demo:acc',[]).filter(x=>x.id!==id));return}
  if(cx.master){const{error}=await sb.from('acc').delete().eq('id',id).eq('venue',cx.vid);if(error)throw error;return}
  const{error}=await sb.rpc('acc_del',{p_code:cx.code,p_id:id});if(error)throw error},
 async mLogin(e,p){if(DEMO){LS.s('demo:m',1);return}const{error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)throw error},
 async mSession(){if(DEMO)return!!LS.g('demo:m',0);const{data}=await sb.auth.getSession();return!!data.session},
 async mOut(){if(DEMO)localStorage.removeItem('demo:m');else await sb.auth.signOut()},
 async mList(){let vs,pn;if(DEMO){const o=dk();vs=Object.keys(o).filter(k=>k.startsWith('venue:')).map(k=>({k,v:o[k].v}));const p=LS.g('demo:pins',{});pn=Object.keys(p).map(c=>({code:c,venue:p[c]}))}
  else{const a=await sb.from('kv').select('k,v').like('k','venue:%');if(a.error)throw a.error;const b=await sb.from('pins').select('code,venue');if(b.error)throw b.error;vs=a.data;pn=b.data}
  return vs.map(x=>({id:x.k.slice(6),doc:x.v,code:(pn.find(p=>p.venue===x.k.slice(6))||{}).code||''})).sort((a,b)=>a.doc.name.localeCompare(b.doc.name))},
 async mSave(id,doc,code,isNew){
  if(DEMO){const p=LS.g('demo:pins',{});for(const c in p)if(p[c]===id)delete p[c];if(p[code])throw new Error('dup');p[code]=id;LS.s('demo:pins',p);await api.kvPut('venue:'+id,id,doc);return}
  const r=await sb.from('pins').upsert({code,venue:id},{onConflict:'venue'});if(r.error)throw r.error.code==='23505'?new Error('dup'):r.error;
  try{await api.kvPut('venue:'+id,id,doc)}catch(e){if(isNew)await sb.from('pins').delete().eq('venue',id);throw e}},
 async mDel(id){if(DEMO){const o=dk();for(const k in o)if(o[k].venue===id)delete o[k];LS.s('demo:kv',o);const p=LS.g('demo:pins',{});for(const c in p)if(p[c]===id)delete p[c];LS.s('demo:pins',p);LS.s('demo:acc',LS.g('demo:acc',[]).filter(e=>e.venue!==id));return}
  for(const t of['kv','acc','pins']){const{error}=await sb.from(t).delete().eq('venue',id);if(error)throw error}}
};
let SUBS=[];
function sub(venue,cb){let t;const f=()=>{clearTimeout(t);t=setTimeout(cb,200)};
 if(DEMO)addEventListener('storage',f);else{const ch=sb.channel('v'+venue+rid(4)).on('postgres_changes',{event:'*',schema:'public',table:'kv',filter:'venue=eq.'+venue},f).subscribe();SUBS.push(()=>sb.removeChannel(ch))}
 const iv=setInterval(cb,6000);SUBS.push(()=>{clearInterval(iv);removeEventListener('storage',f)})}
const unsub=()=>{SUBS.forEach(f=>f());SUBS=[]};

/* ===== ACCOUNTING QUEUE ===== */
const Q=()=>LS.g('accq',[]);let fl=false;
function queueAcc(e,cx){const q=Q();q.push({e,cx});LS.s('accq',q);flushQ()}
async function flushQ(){if(fl)return;fl=true;let err='';for(const it of Q()){try{await api.accPut(it.cx,it.e);LS.s('accq',Q().filter(x=>x.e.id!==it.e.id))}catch(e){err=errMsg(e);break}}fl=false;const n=Q().length;
 $('#banner').innerHTML=n?`<div class="ban"><span>⚠ ${n} accounting ${n>1?'entries':'entry'} not saved: ${esc(err||'waiting')}</span><button class="btn sm ghost" id="retry">Retry</button></div>`:'';if(n)$('#retry').onclick=flushQ}

async function boot(){
 if(P.has('v'))return customer(P.get('v'),P.get('t')||'1');
 if(P.get('id'))return ownerEnter(P.get('id'),true);
 if(P.has('master')){return(await api.mSession())?master():masterLogin()}
 if(await api.mSession())return master();
 const id=localStorage.getItem('ownerId');if(id)return ownerEnter(id,false);enterId()}
function enterId(){view(`<main class="wrap c"><div class="card big"><h1>Enter your ID</h1><p><input id="oid" placeholder="Access ID" autocapitalize="off" autocomplete="off" spellcheck="false"></p><button class="btn" id="go" style="width:100%">Continue</button></div></main>`);
 const go=()=>{const v=$('#oid').value.trim();if(!/^[a-z0-9]{8,}$/i.test(v))return toast('ID must be 8 or more letters/numbers',1);ownerEnter(v,false)};$('#go').onclick=go;$('#oid').onkeydown=e=>{if(e.key==='Enter')go()}}
async function ownerEnter(code,link){code=code.toLowerCase();let vid;try{vid=await api.ownerVenue(code)}catch(e){toast(errMsg(e),1);return enterId()}
 if(!vid){localStorage.removeItem('ownerId');toast('ID not found',1);return enterId()}
 localStorage.setItem('ownerId',code);if(link)history.replaceState(null,'',BASE);dash({vid,code,master:false})}
function masterLogin(){view(`<main class="wrap c"><div class="card"><h1>Master sign-in</h1>${DEMO?'<small>Demo mode: any email/password works.</small>':''}<label>Email<input id="me" type="email" autocomplete="username"></label><label>Password<input id="mp" type="password" autocomplete="current-password"></label><button class="btn" id="ml" style="width:100%">Sign in</button></div></main>`);
 $('#ml').onclick=async()=>{try{await api.mLogin($('#me').value.trim(),$('#mp').value);location.replace(BASE)}catch(e){toast(errMsg(e),1)}}}

/* ===== CUSTOMER ===== */
async function customer(vid,t){
 let ven;try{ven=await api.kvGet('venue:'+vid)}catch(e){return view(msgCard('Can’t connect','Please check your internet and refresh.'))}
 if(!ven)return view(msgCard('Venue not found','Please scan the table’s QR code again.'));
 t=parseInt(t,10);if(!(t>=1&&t<=ven.tables))return view(msgCard('Table not found','Please scan the table’s QR code again.'));
 const key=`tbl:${vid}:${t}`;let doc=null,mySid=null,gone=false,cart={},paused=ven.active===false,last='';
 const items=[];ven.menu.forEach(c=>c.items.forEach(i=>items.push({...i,c:c.c})));
 async function pull(){try{ven=(await api.kvGet('venue:'+vid))||ven;paused=ven.active===false;doc=await api.kvGet(key)}catch(e){return}
  if(doc){if(mySid===null)mySid=doc.sid;else if(doc.sid!==mySid)gone=true}
  const s=JSON.stringify([doc,paused,gone]);if(s!==last){last=s;draw()}}
 async function mutT(fn){if(gone)return false;try{const cur=await api.kvGet(key);if(cur&&mySid!==null&&cur.sid!==mySid){gone=true;draw();return false}
   const d=cur||{sid:rid(10),items:[],reqs:[],call:false};if(mySid===null)mySid=d.sid;fn(d);await api.kvPut(key,vid,d);doc=d;last='';draw();return true}
  catch(e){toast(/row-level|paused/i.test(e.message)?'Ordering is paused':'Could not send. Please try again.',1);pull();return false}}
 function draw(){
  if(gone)return view(`<main class="wrap c"><div class="card big"><div class="ok">✓</div><h2>Thank you!</h2><p>Scan the QR code again to order.</p></div></main>`);
  if(paused)return view(msgCard('Ordering is paused','Please ask the staff for help.'));
  const mine=(doc&&doc.items)||[],n=Object.values(cart).reduce((a,b)=>a+b,0),tot=items.reduce((s,i,x)=>s+(cart[x]||0)*i.p,0);let ix=0;
  view(`<main class="wrap c"><header><div><h1>${esc(ven.name)}</h1><small>Table ${t}</small></div><button class="bell${doc&&doc.call?' on':''}" data-a="call" >🔔 ${doc&&doc.call?'Waiter called':'Call waiter'}</button></header>
  ${mine.length?`<div class="card st"><b>Please wait, your order is getting ready</b>${mine.map(i=>`<div class="it"><span>${i.q} × ${esc(i.n)}</span><span>${money(i.p*i.q)}</span></div>`).join('')}<div class="th"><b>Total</b><b>${money(total(mine))}</b></div>${doc.reqs.length?'<small>Your change request was sent to the staff.</small><br>':''}<button class="btn ghost sm" data-a="edit">Edit order</button></div>`:''}
  ${ven.menu.map(c=>`<h3 class="cat">${esc(c.c)}</h3>${c.items.map(i=>{const x=ix++,q=cart[x]||0;return`<div class="mi"><div><b>${esc(i.n)}</b><br><small>${money(i.p)}</small></div><div class="stp"><button data-a="dec" data-i="${x}" ${q?'':'disabled'} aria-label="Less">−</button><b>${q}</b><button data-a="inc" data-i="${x}" aria-label="More">+</button></div></div>`}).join('')}`).join('')}

async function saleDlg(){let L;try{const[a,b]=dayB(S.date);L=await api.accList(S,a,b)}catch(e){return toast(errMsg(e),1)}const s=L.reduce((x,e)=>x+ +e.amount,0);
 modal(`<h3>Sale on ${esc(S.date)}</h3><p style="font-size:2rem;margin:.3em 0"><b>${money(s)}</b></p><small>${L.length} bill${L.length==1?'':'s'}</small>${Q().length?'<p class="sm">Some entries are still waiting to be saved and are not counted.</p>':''}<div class="row"><button class="btn" data-x>Close</button></div>`,(d,c)=>{$('[data-x]',d).onclick=c})}

/* ===== MASTER ===== */
async function master(){unsub();app.onchange=null;let L;try{L=await api.mList()}catch(e){return view(msgCard('Error',esc(errMsg(e))))}
 view(`<main class="wrap"><header><div><h1>Master panel</h1><small>${DEMO?'Demo mode · data stays in this browser':'Signed in'}</small></div><button class="btn ghost sm" data-a="mo">Sign out</button></header><button class="btn" data-a="new" style="width:100%;margin-bottom:12px">+ New venue</button>
 ${L.map((v,k)=>`<div class="card"><div class="th"><b>${esc(v.doc.name)}</b><span class="tag${v.doc.active===false?' p':''}">${v.doc.active===false?'Suspended':'Active'}</span></div><small>${v.doc.tables} tables · venue ID ${esc(v.id)} · owner ID ${esc(v.code)}</small><div class="row" style="margin-top:8px"><button class="btn sm" data-a="open" data-i="${k}">Open</button><button class="btn ghost sm" data-a="link" data-i="${k}">Owner link</button><button class="btn ghost sm" data-a="edit" data-i="${k}">Edit</button></div><div class="row" style="margin-top:6px"><button class="btn ghost sm" data-a="sus" data-i="${k}">${v.doc.active===false?'Reactivate':'Suspend'}</button><button class="btn out sm" data-a="del" data-i="${k}">Delete</button></div></div>`).join('')||'<div class="card empty">No venues yet.</div>'}</main>`);
 app.onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=L[+b.dataset.i];
  if(a==='mo'){await api.mOut();return location.replace(BASE)}
  if(a==='new')return editor(null,master);
  if(a==='open')return dash({vid:v.id,code:v.code,master:true});
  if(a==='edit')return editor(v,master);
  if(a==='link'){const u=`${BASE}?id=${v.code}`;return modal(`<h3>Owner link</h3><input id="lk" readonly value="${esc(u)}"><div class="row"><button class="btn ghost" data-x>Close</button><button class="btn" data-c>Copy</button></div>`,(d,c)=>{$('[data-x]',d).onclick=c;$('#lk',d).select();$('[data-c]',d).onclick=async()=>{try{await navigator.clipboard.writeText(u);toast('Copied')}catch(x){$('#lk',d).select();toast('Press and hold the link to copy',1)}}})}
  if(a==='sus'){const doc={...v.doc,active:v.doc.active===false};try{await api.kvPut('venue:'+v.id,v.id,doc);toast(doc.active?'Reactivated':'Suspended');master()}catch(x){toast(errMsg(x),1)}}
  if(a==='del')ask('Delete venue?',`“${esc(v.doc.name)}” and all its orders and accounts will be permanently deleted.`,'Delete',async()=>{try{await api.mDel(v.id);toast('Deleted');master()}catch(x){toast(errMsg(x),1)}},true)}}

/* ===== MENU SCANNER (photo/PDF/Excel/CSV/text -> menu text) ===== */
const loadJS=u=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=()=>no(new Error('Could not load scanner library. Check internet.'));document.head.appendChild(s)});
function toMenuText(raw){const out=[];let cat=false;
 for(let l of raw.split(/\r?\n/)){l=l.replace(/\s+/g,' ').trim().replace(/^(?:[•*·\-–]|\d+[.)])\s*/,'');if(l.length<2)continue;
  const m=l.match(/^(.*?)[\s.·…:_\-–—|]*(?:₹|Rs\.?|INR)?\s*(\d{1,5}(?:\.\d{1,2})?)\s*(?:\/-|₹)?\s*$/i);
  if(m&&/[a-z\u0900-\u097f]/i.test(m[1])&&m[1].trim().length>=2){if(!cat){out.push('# Menu');cat=true}out.push(m[1].replace(/[\s.·…:_\-–—|]+$/,'').trim()+' @ '+m[2])}
  else if(/[a-z]/i.test(l)&&l.length<=40&&!/\d/.test(l)){if(out.length)out.push('');out.push('# '+l.replace(/[:\-–—]+$/,'').trim());cat=true}}
 return out.join('\n')}
async function scanMenu(f){const n=f.name.toLowerCase();let t='';
 if(f.type.startsWith('image/')){await loadJS('https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.5/tesseract.min.js');const w=await Tesseract.createWorker('eng');try{t=(await w.recognize(f)).data.text}finally{await w.terminate()}}
 else if(n.endsWith('.pdf')){await loadJS('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;for(let p=1;p<=pdf.numPages;p++){const c=await(await pdf.getPage(p)).getTextContent(),rows={};c.items.forEach(i=>{const y=Math.round(i.transform[5]/3);(rows[y]=rows[y]||[]).push(i)});
   Object.keys(rows).sort((a,b)=>b-a).forEach(y=>{t+=rows[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str).join(' ')+'\n'})}
  if(!t.trim())throw new Error('This PDF has no readable text (it is probably a scan). Upload it as a photo instead.')}
 else if(/\.(xlsx|xls|csv)$/.test(n)){const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});wb.SheetNames.forEach(s=>{XLSX.utils.sheet_to_json(wb.Sheets[s],{header:1,defval:''}).forEach(r=>{t+=r.filter(x=>x!=='').join(' ')+'\n'})})}
 else t=await f.text();
 return toMenuText(t)}
function editor(v,done){const d=v?v.doc:{name:'',tables:5,menu:[],active:true};
 modal(`<h3>${v?'Edit venue':'New venue'}</h3><label>Venue name<input id="en" value="${esc(d.name)}"></label><label>Tables<input id="et" type="number" min="1" max="200" value="${d.tables}"></label><label>Owner access ID <small>8+ letters/numbers</small><span class="row"><input id="ec" value="${esc(v?v.code:'')}" autocapitalize="off" autocomplete="off"><button class="btn ghost" type="button" data-g style="flex:none">Generate</button></span></label><label>Scan menu from a photo, PDF, Excel or text file <small>optional</small><input type="file" id="ef" accept="image/*,.pdf,.txt,.csv,.xlsx,.xls"></label><small id="es"></small><label>Menu <small>“# Category” lines, then “Item @ price”</small><textarea id="em" rows="9">${esc(menuTxt(d.menu))}</textarea></label><div class="row"><button class="btn ghost" data-x>Cancel</button><button class="btn" data-s>Save</button></div>`,(el,close)=>{
  $('#ef',el).onchange=async ev=>{const f=ev.target.files[0];if(!f)return;const st=$('#es',el);st.textContent='Reading “'+f.name+'”… photos can take a minute.';try{const t=await scanMenu(f);if(!t.trim())throw new Error('No menu lines found. Try a clearer photo.');const ta=$('#em',el);ta.value=(ta.value.trim()?ta.value.trim()+'\n\n':'')+t;st.textContent='Done. Check the text below, fix any mistakes, then Save.'}catch(x){st.textContent='';toast('Scan failed: '+errMsg(x),1)}ev.target.value=''};
  $('[data-x]',el).onclick=close;$('[data-g]',el).onclick=()=>{$('#ec',el).value=rid(10)};
  $('[data-s]',el).onclick=async()=>{try{const name=$('#en',el).value.trim(),tables=parseInt($('#et',el).value,10),code=$('#ec',el).value.trim().toLowerCase();
   if(!name)throw new Error('Enter a venue name');if(!(tables>=1&&tables<=200))throw new Error('Tables must be 1–200');if(!/^[a-z0-9]{8,}$/.test(code))throw new Error('Owner ID: 8+ letters/numbers');
   const menu=parseMenu($('#em',el).value);let id=v?v.id:null;if(!v){id=rid(6);while(await api.kvGet('venue:'+id))id=rid(6)}
   await api.mSave(id,{...d,name,tables,menu,active:d.active!==false},code,!v);close();toast('Saved');done()}catch(x){toast(x.message==='dup'?'That owner ID is already used':errMsg(x),1)}}})}
boot();
</script></body></html>
